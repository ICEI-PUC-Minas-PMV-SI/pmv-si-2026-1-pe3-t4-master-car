<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterCar — Usuários</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/users.css">
</head>
<body>

<div class="app-layout">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../assets/logo.jpg" alt="MasterCar Logo">
      <span class="sidebar-logo-text">MC</span>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Operações</span>

      <button class="nav-item" data-nav="dashboard" onclick="navigate('dashboard')">
        <span>Dashboard</span>
      </button>

      <button class="nav-item" data-nav="reservas" onclick="navigate('reservas')">
        <span>Reservas</span>
      </button>

      <button class="nav-item" data-nav="veiculos" onclick="navigate('veiculos')">
        <span>Veículos</span>
      </button>

      <button class="nav-item" data-nav="clientes" onclick="navigate('clientes')">
        <span>Clientes</span>
      </button>

      <span class="nav-section-label" style="margin-top:12px;">Administração</span>

      <button class="nav-item active" data-nav="users" onclick="navigate('users')">
        <span>Usuários</span>
      </button>

      <button class="nav-item" data-nav="config" onclick="showToast('Em breve', 'info')">
        <span>Configurações</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:700;">JA</div>
        <button class="btn-logout" onclick="navigate('login')" title="Sair">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN ═══ -->
  <div class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <nav class="breadcrumb">
          <span class="breadcrumb-item">Usuários</span>
        </nav>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" title="Notificações">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
        </button>
        <div class="topbar-divider"></div>
        <button class="topbar-btn" title="Perfil">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- PAGE: USERS -->
    <div class="page page-container">

      <div class="page-header page-header-row">
        <div>
          <h1 style="font-family:var(--font-display);font-size:2.2rem;letter-spacing:0.1em;text-transform:uppercase;line-height:1;color:var(--white);">Usuários</h1>
          <p style="margin-top:6px;font-size:.875rem;color:var(--gray-500);">Gerencie os acessos ao sistema</p>
        </div>
        <button class="btn btn-primary" onclick="openNovoUsuario()">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
          </svg>
          Novo Usuário
        </button>
      </div>

      <!-- TOOLBAR -->
      <div class="users-toolbar">
        <div class="search-wrap">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input
            type="search"
            class="search-input"
            placeholder="Buscar usuário..."
            id="searchUsers"
          >
        </div>
        <select class="filter-select" id="filterRole">
          <option value="">Todos os perfis</option>
          <option value="admin">Administrador</option>
          <option value="employee">Funcionário</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="users-table-card">
        <table class="users-table">
          <thead>
            <tr>
              <th>Usuário</th>
              <th>Perfil</th>
              <th>Status</th>
              <th>Último acesso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center;color:var(--gray-600);padding:24px;">Carregando...</td></tr>
          </tbody>
        </table>
      </div>

    </div><!-- /page -->

  </div><!-- /main-content -->
</div><!-- /app-layout -->

<!-- ═══ MODAL: NOVO/EDITAR USUÁRIO ═══ -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 class="modal-title">Novo Usuário</h2>
        <p class="modal-subtitle">Preencha os dados para criar o acesso</p>
      </div>
      <button class="modal-close" onclick="closeModal('userModal')">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form onsubmit="handleSaveUser(event)">
      <div class="modal-body">

        <div class="field-group">
          <label>Nome Completo</label>
          <input type="text" id="u_nome" class="field-input" placeholder="Ex: Ana Silva" required>
        </div>

        <div class="modal-row">
          <div class="field-group">
            <label>E-mail</label>
            <input type="email" id="u_email" class="field-input" placeholder="ana@email.com" required>
          </div>
          <div class="field-group">
            <label>Perfil de Acesso</label>
            <select id="u_role" class="field-input">
              <option value="admin">Administrador</option>
              <option value="employee">Funcionário</option>
            </select>
          </div>
        </div>

        <div class="modal-row">
          <div class="field-group">
            <label>Status</label>
            <select id="u_status" class="field-input">
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
            </select>
          </div>
          <div class="field-group">
            <label>Senha</label>
            <input
              type="password"
              id="u_password"
              class="field-input"
              placeholder="Mínimo 8 caracteres"
              oninput="checkPasswordStrength(this.value)"
            >
            <div class="password-strength">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('userModal')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Usuário</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initUsers();
    renderUsersTable();
    document.getElementById('searchUsers').addEventListener('input', renderUsersTable);
    document.getElementById('filterRole').addEventListener('change', renderUsersTable);
  });
</script>
</body>
</html>
